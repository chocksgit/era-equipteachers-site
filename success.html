<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Submitted | ERA</title>
  <style>
    :root{--navy:#08285f;--blue:#0b3b8c;--line:#d9e2ef;--muted:#53627a;--soft:#f8fbff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f8fbff,#eef6ff);color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{max-width:680px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px rgba(8,40,95,.14);padding:48px 36px;text-align:center}
    img{max-width:300px;width:80%;height:auto;margin-bottom:24px}
    h1{font-size:42px;line-height:1.1;color:var(--navy);margin:0 0 16px;font-weight:950}
    p{font-size:18px;color:var(--muted);line-height:1.6;margin:0 0 12px}
    .btn{display:inline-flex;margin-top:24px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;text-decoration:none;border-radius:12px;padding:14px 24px;font-weight:900;box-shadow:0 10px 22px rgba(8,40,95,.25)}
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="ERA - Exam Readiness Assessment" />
    <h1>Thank You!</h1>
    <p>Your assessment request has been submitted successfully.</p>
    <p>Our team will contact you shortly with access details and next steps.</p>
    <a class="btn" href="/">Return to ERA Home</a>
  </main>
</body>
</html>
